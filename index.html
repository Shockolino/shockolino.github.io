<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0f0f13">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ScoreTracker">
  <meta name="description" content="Traccia i punteggi dei tuoi giochi da tavolo">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <title>ScoreTracker</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f0f13;
      --surface: #1a1a22;
      --surface2: #22222d;
      --border: #2e2e3d;
      --accent: #f5c842;
      --accent2: #e8885a;
      --text: #f0f0f5;
      --text2: #8888a0;
      --text3: #555568;
      --danger: #e85a5a;
      --green: #5ae8a0;
      --radius: 16px;
      --radius-sm: 8px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
      padding-bottom: env(safe-area-inset-bottom);
    }

    /* ── SCREENS ── */
    .screen { display: none; min-height: 100vh; flex-direction: column; }
    .screen.active { display: flex; }

    /* ── TOP BAR ── */
    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 20px 12px;
      padding-top: calc(16px + env(safe-area-inset-top));
      border-bottom: 1px solid var(--border);
      background: var(--bg);
      position: sticky; top: 0; z-index: 10;
    }
    .topbar-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 28px;
      letter-spacing: 2px;
      color: var(--accent);
    }
    .btn-icon {
      width: 40px; height: 40px;
      border-radius: 50%;
      border: none;
      background: var(--surface2);
      color: var(--text);
      font-size: 20px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background .15s, transform .1s;
    }
    .btn-icon:active { transform: scale(.93); background: var(--border); }

    /* ── HOME ── */
    .home-content { flex: 1; overflow-y: auto; padding: 20px; }
    .section-label {
      font-size: 11px; font-weight: 600; letter-spacing: .12em;
      text-transform: uppercase; color: var(--text3);
      margin-bottom: 12px; margin-top: 24px;
    }
    .section-label:first-child { margin-top: 0; }

    .game-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 10px;
      cursor: pointer;
      transition: background .15s, transform .1s;
      display: flex; align-items: center; gap: 14px;
    }
    .game-card:active { transform: scale(.98); background: var(--surface2); }
    .game-card-emoji { font-size: 28px; min-width: 36px; text-align: center; }
    .game-card-info { flex: 1; min-width: 0; }
    .game-card-name { font-weight: 600; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .game-card-meta { font-size: 13px; color: var(--text2); margin-top: 2px; }
    .game-card-score { text-align: right; }
    .score-badge {
      font-family: 'DM Mono', monospace;
      font-size: 18px; font-weight: 500;
      color: var(--accent);
    }
    .game-card-date { font-size: 11px; color: var(--text3); margin-top: 2px; }

    .empty-state {
      text-align: center; padding: 60px 20px;
      color: var(--text2);
    }
    .empty-icon { font-size: 64px; margin-bottom: 16px; opacity: .5; }
    .empty-title { font-size: 18px; font-weight: 600; color: var(--text); margin-bottom: 8px; }
    .empty-desc { font-size: 14px; line-height: 1.6; }

    .fab {
      position: fixed;
      bottom: calc(28px + env(safe-area-inset-bottom));
      right: 24px;
      width: 60px; height: 60px;
      border-radius: 50%;
      background: var(--accent);
      color: #000;
      font-size: 28px;
      border: none;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 8px 24px rgba(245,200,66,.35);
      transition: transform .15s, box-shadow .15s;
      z-index: 100;
    }
    .fab:active { transform: scale(.93); box-shadow: 0 4px 12px rgba(245,200,66,.2); }

    /* ── MODAL / SHEET ── */
    .overlay {
      display: none;
      position: fixed; inset: 0;
      background: rgba(0,0,0,.7);
      z-index: 200;
      align-items: flex-end;
      backdrop-filter: blur(4px);
    }
    .overlay.open { display: flex; }
    .sheet {
      background: var(--surface);
      border-radius: 20px 20px 0 0;
      width: 100%;
      max-height: 92vh;
      overflow-y: auto;
      padding: 0 20px calc(32px + env(safe-area-inset-bottom));
      animation: slideUp .25s ease;
    }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    .sheet-handle {
      width: 40px; height: 4px; border-radius: 2px;
      background: var(--border);
      margin: 12px auto 20px;
    }
    .sheet-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 26px; letter-spacing: 1px;
      color: var(--accent); margin-bottom: 20px;
    }

    /* ── FORM ── */
    .form-group { margin-bottom: 18px; }
    .form-label { font-size: 12px; font-weight: 600; color: var(--text2); letter-spacing: .08em; text-transform: uppercase; margin-bottom: 7px; display: block; }
    .form-input {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 16px;
      padding: 12px 14px;
      outline: none;
      transition: border-color .15s;
    }
    .form-input:focus { border-color: var(--accent); }
    .form-input::placeholder { color: var(--text3); }

    .players-list { display: flex; flex-direction: column; gap: 8px; }
    .player-row {
      display: flex; align-items: center; gap: 10px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 8px 10px;
    }
    .player-color-dot {
      width: 22px; height: 22px;
      border-radius: 50%;
      flex-shrink: 0;
      border: 2px solid transparent;
      cursor: pointer;
    }
    .player-name-input {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      outline: none;
    }
    .player-remove {
      background: none; border: none;
      color: var(--text3); font-size: 18px;
      cursor: pointer; padding: 4px;
      transition: color .15s;
    }
    .player-remove:hover { color: var(--danger); }

    .btn-add-player {
      width: 100%; background: none;
      border: 1.5px dashed var(--border);
      border-radius: var(--radius-sm);
      color: var(--text2);
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      padding: 12px;
      cursor: pointer; margin-top: 8px;
      transition: border-color .15s, color .15s;
    }
    .btn-add-player:hover { border-color: var(--accent); color: var(--accent); }

    .colors-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
    .color-swatch {
      width: 28px; height: 28px;
      border-radius: 50%;
      cursor: pointer;
      border: 2px solid transparent;
      transition: transform .1s, border-color .1s;
    }
    .color-swatch.selected { border-color: white; transform: scale(1.2); }

    .btn-primary {
      width: 100%;
      background: var(--accent);
      color: #000;
      font-family: 'DM Sans', sans-serif;
      font-weight: 600; font-size: 16px;
      padding: 16px;
      border: none;
      border-radius: var(--radius-sm);
      cursor: pointer;
      margin-top: 8px;
      transition: opacity .15s, transform .1s;
    }
    .btn-primary:active { opacity: .85; transform: scale(.99); }
    .btn-secondary {
      width: 100%;
      background: var(--surface2);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-weight: 500; font-size: 15px;
      padding: 14px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      cursor: pointer;
      margin-top: 8px;
      transition: background .15s;
    }
    .btn-secondary:active { background: var(--border); }
    .btn-danger {
      width: 100%;
      background: rgba(232,90,90,.1);
      color: var(--danger);
      font-family: 'DM Sans', sans-serif;
      font-weight: 500; font-size: 15px;
      padding: 14px;
      border: 1px solid rgba(232,90,90,.3);
      border-radius: var(--radius-sm);
      cursor: pointer;
      margin-top: 8px;
      transition: background .15s;
    }
    .btn-danger:active { background: rgba(232,90,90,.2); }

    /* ── GAME SCREEN ── */
    .game-header {
      padding: 14px 20px;
      padding-top: calc(14px + env(safe-area-inset-top));
      display: flex; align-items: center; gap: 12px;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      position: sticky; top: 0; z-index: 10;
    }
    .game-title-bar { flex: 1; }
    .game-name { font-family: 'Bebas Neue', sans-serif; font-size: 22px; letter-spacing: 1.5px; }
    .game-round-label { font-size: 12px; color: var(--text2); }

    .players-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 12px;
      padding: 16px;
    }
    .player-tile {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 14px;
      display: flex; flex-direction: column; align-items: center;
      gap: 10px;
      position: relative;
      transition: border-color .15s;
    }
    .player-tile.leader { border-color: var(--accent); }
    .rank-badge {
      position: absolute; top: 8px; left: 10px;
      font-size: 11px; font-weight: 600;
      color: var(--text3);
      font-family: 'DM Mono', monospace;
    }
    .player-tile.leader .rank-badge { color: var(--accent); }
    .player-dot {
      width: 40px; height: 40px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 16px; color: #000;
    }
    .player-tile-name {
      font-size: 14px; font-weight: 600;
      text-align: center;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      max-width: 100%;
    }
    .player-tile-score {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 42px;
      line-height: 1;
      letter-spacing: 1px;
    }
    .score-controls { display: flex; gap: 8px; align-items: center; }
    .score-btn {
      width: 36px; height: 36px;
      border-radius: 50%;
      border: none;
      font-size: 20px; font-weight: 700;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: transform .1s, opacity .15s;
    }
    .score-btn:active { transform: scale(.88); opacity: .8; }
    .score-btn.minus { background: var(--surface2); color: var(--text2); }
    .score-btn.plus { background: var(--accent); color: #000; }
    .custom-add {
      display: flex; gap: 6px; align-items: center; width: 100%;
    }
    .custom-input {
      flex: 1;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text);
      font-family: 'DM Mono', monospace;
      font-size: 15px;
      padding: 8px 10px;
      outline: none; text-align: center;
      min-width: 0;
      transition: border-color .15s;
    }
    .custom-input:focus { border-color: var(--accent); }
    .apply-btn {
      background: var(--accent); color: #000;
      border: none; border-radius: var(--radius-sm);
      padding: 8px 12px;
      font-family: 'DM Sans', sans-serif;
      font-weight: 600; font-size: 13px;
      cursor: pointer; white-space: nowrap;
      transition: opacity .15s;
    }
    .apply-btn:active { opacity: .8; }

    /* ── HISTORY PANEL (inside game) ── */
    .history-panel {
      padding: 16px 20px;
      border-top: 1px solid var(--border);
    }
    .history-title {
      font-size: 12px; font-weight: 600; color: var(--text3);
      text-transform: uppercase; letter-spacing: .1em;
      margin-bottom: 12px;
    }
    .history-entry {
      display: flex; align-items: center; gap: 10px;
      padding: 8px 0;
      border-bottom: 1px solid var(--border);
      font-size: 13px;
    }
    .history-entry:last-child { border-bottom: none; }
    .history-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .history-player { font-weight: 500; flex: 1; color: var(--text2); }
    .history-delta {
      font-family: 'DM Mono', monospace;
      font-weight: 500;
    }
    .history-delta.pos { color: var(--green); }
    .history-delta.neg { color: var(--danger); }

    /* ── TABS ── */
    .tabs {
      display: flex;
      border-bottom: 1px solid var(--border);
      background: var(--bg);
      position: sticky; top: 0; z-index: 5;
    }
    .tab {
      flex: 1; padding: 14px 8px;
      text-align: center;
      font-size: 13px; font-weight: 600;
      color: var(--text2);
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: color .15s, border-color .15s;
    }
    .tab.active { color: var(--accent); border-bottom-color: var(--accent); }

    /* ── STATS ── */
    .stats-content { padding: 16px 20px; }
    .stats-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 12px;
    }
    .stats-card-title { font-size: 12px; font-weight: 600; color: var(--text3); text-transform: uppercase; letter-spacing: .1em; margin-bottom: 12px; }
    .ranking-row {
      display: flex; align-items: center; gap: 12px;
      padding: 8px 0;
    }
    .rank-num {
      font-family: 'DM Mono', monospace;
      font-size: 16px; font-weight: 500;
      color: var(--text3); min-width: 24px;
    }
    .rank-num.gold { color: #f5c842; }
    .rank-num.silver { color: #b0b0c0; }
    .rank-num.bronze { color: #e8885a; }
    .ranking-bar-wrap { flex: 1; background: var(--surface2); border-radius: 4px; height: 8px; overflow: hidden; }
    .ranking-bar { height: 100%; border-radius: 4px; transition: width .4s ease; }
    .ranking-score {
      font-family: 'DM Mono', monospace;
      font-size: 15px; font-weight: 500; min-width: 48px; text-align: right;
    }

    /* ── WINNER SCREEN ── */
    .winner-overlay {
      display: none;
      position: fixed; inset: 0;
      background: rgba(0,0,0,.92);
      z-index: 300;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 32px;
      animation: fadeIn .3s ease;
    }
    .winner-overlay.open { display: flex; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .winner-emoji { font-size: 80px; margin-bottom: 16px; animation: bounce .6s ease infinite alternate; }
    @keyframes bounce { from { transform: translateY(0); } to { transform: translateY(-12px); } }
    .winner-label { font-size: 13px; font-weight: 600; color: var(--text3); letter-spacing: .15em; text-transform: uppercase; margin-bottom: 8px; }
    .winner-name { font-family: 'Bebas Neue', sans-serif; font-size: 52px; letter-spacing: 3px; color: var(--accent); }
    .winner-score { font-family: 'DM Mono', monospace; font-size: 24px; color: var(--text2); margin-bottom: 32px; }
    .confetti { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
    .confetti-piece {
      position: absolute;
      width: 8px; height: 8px;
      border-radius: 2px;
      animation: fall linear infinite;
    }
    @keyframes fall {
      0% { transform: translateY(-20px) rotate(0deg); opacity: 1; }
      100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
    }

    /* ── TOAST ── */
    .toast {
      position: fixed; bottom: calc(90px + env(safe-area-inset-bottom));
      left: 50%; transform: translateX(-50%) translateY(20px);
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 30px;
      padding: 10px 20px;
      font-size: 14px; font-weight: 500;
      opacity: 0; pointer-events: none;
      transition: opacity .2s, transform .2s;
      z-index: 500; white-space: nowrap;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* ── SCROLLBAR ── */
    ::-webkit-scrollbar { width: 0; }

    .divider { height: 1px; background: var(--border); margin: 4px 0; }

    .install-banner {
      background: linear-gradient(135deg, var(--accent2), var(--accent));
      border-radius: var(--radius);
      padding: 14px 16px;
      margin-bottom: 16px;
      display: flex; align-items: center; gap: 12px;
      cursor: pointer;
    }
    .install-banner-text { flex: 1; }
    .install-banner-title { font-weight: 700; font-size: 14px; color: #000; }
    .install-banner-sub { font-size: 12px; color: rgba(0,0,0,.6); margin-top: 2px; }
    .install-banner-icon { font-size: 24px; }
    .install-banner-close { font-size: 18px; color: rgba(0,0,0,.5); background: none; border: none; cursor: pointer; padding: 4px; }
  </style>
</head>
<body>

<!-- ════════════════ HOME SCREEN ════════════════ -->
<div class="screen active" id="screen-home">
  <div class="topbar">
    <span class="topbar-title">🎲 ScoreTracker</span>
    <button class="btn-icon" onclick="openHistoryFull()" title="Cronologia">📋</button>
  </div>
  <div class="home-content" id="home-content">
    <div id="install-banner-wrap"></div>
    <div id="active-games-section"></div>
    <div id="recent-games-section"></div>
    <div id="empty-home" class="empty-state" style="display:none">
      <div class="empty-icon">🎯</div>
      <div class="empty-title">Nessuna partita</div>
      <div class="empty-desc">Premi + per creare la tua prima partita e iniziare a tenere il punteggio.</div>
    </div>
  </div>
  <button class="fab" onclick="openNewGame()">＋</button>
</div>

<!-- ════════════════ GAME SCREEN ════════════════ -->
<div class="screen" id="screen-game">
  <div class="game-header">
    <button class="btn-icon" onclick="goHome()">←</button>
    <div class="game-title-bar">
      <div class="game-name" id="game-title">Partita</div>
      <div class="game-round-label" id="game-round-label">Round 1</div>
    </div>
    <button class="btn-icon" onclick="openGameMenu()">⋯</button>
  </div>

  <div class="tabs">
    <div class="tab active" onclick="switchTab('scores')">Punteggi</div>
    <div class="tab" onclick="switchTab('history')">Cronologia</div>
    <div class="tab" onclick="switchTab('stats')">Statistiche</div>
  </div>

  <div id="tab-scores" style="flex:1;overflow-y:auto">
    <div class="players-grid" id="players-grid"></div>
  </div>

  <div id="tab-history" style="display:none;flex:1;overflow-y:auto">
    <div class="history-panel">
      <div class="history-title">Storico Mosse</div>
      <div id="history-list"></div>
    </div>
  </div>

  <div id="tab-stats" style="display:none;flex:1;overflow-y:auto">
    <div class="stats-content" id="stats-content"></div>
  </div>
</div>

<!-- ════════════════ NEW GAME SHEET ════════════════ -->
<div class="overlay" id="overlay-new-game" onclick="closeIfOverlay(event,'overlay-new-game')">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-title">Nuova Partita</div>

    <div class="form-group">
      <label class="form-label">Nome Gioco</label>
      <input class="form-input" id="input-game-name" placeholder="es. Catan, Ticket to Ride…" maxlength="40">
    </div>
    <div class="form-group">
      <label class="form-label">Emoji / Icona</label>
      <div class="colors-row" id="emoji-picker">
        🎲🃏🏆🎯🧩♟️🎮🎰🪀🎳🎸⚽🏀🏈🎾
      </div>
      <input class="form-input" id="input-game-emoji" placeholder="🎲" maxlength="2" style="margin-top:8px;font-size:24px;text-align:center">
    </div>

    <div class="form-group">
      <label class="form-label">Giocatori</label>
      <div class="players-list" id="new-players-list"></div>
      <button class="btn-add-player" onclick="addPlayerRow()">＋ Aggiungi giocatore</button>
    </div>

    <div class="form-group">
      <label class="form-label">Punteggio iniziale</label>
      <input class="form-input" id="input-start-score" type="number" value="0" placeholder="0">
    </div>

    <button class="btn-primary" onclick="createGame()">🚀 Inizia Partita</button>
    <button class="btn-secondary" onclick="closeSheet('overlay-new-game')">Annulla</button>
  </div>
</div>

<!-- ════════════════ GAME MENU SHEET ════════════════ -->
<div class="overlay" id="overlay-game-menu" onclick="closeIfOverlay(event,'overlay-game-menu')">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-title">Opzioni</div>
    <button class="btn-secondary" onclick="addRound()">🔁 Nuovo Round</button>
    <button class="btn-secondary" onclick="shareGame()">📤 Condividi Punteggi</button>
    <button class="btn-secondary" onclick="showWinner()">🏆 Mostra Vincitore</button>
    <div class="divider" style="margin:12px 0"></div>
    <button class="btn-danger" onclick="confirmEndGame()">🗑️ Termina & Elimina</button>
    <button class="btn-secondary" onclick="closeSheet('overlay-game-menu')">Chiudi</button>
  </div>
</div>

<!-- ════════════════ FULL HISTORY SHEET ════════════════ -->
<div class="overlay" id="overlay-history-full" onclick="closeIfOverlay(event,'overlay-history-full')">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-title">Partite Precedenti</div>
    <div id="full-history-list"></div>
    <button class="btn-secondary" onclick="closeSheet('overlay-history-full')" style="margin-top:12px">Chiudi</button>
  </div>
</div>

<!-- ════════════════ WINNER OVERLAY ════════════════ -->
<div class="winner-overlay" id="winner-overlay">
  <div class="confetti" id="confetti"></div>
  <div class="winner-emoji">🏆</div>
  <div class="winner-label">Vincitore</div>
  <div class="winner-name" id="winner-name">—</div>
  <div class="winner-score" id="winner-score"></div>
  <button class="btn-primary" style="max-width:260px" onclick="closeWinner()">Continua a Giocare</button>
  <button class="btn-secondary" style="max-width:260px" onclick="goHome()">Torna a Casa</button>
</div>

<!-- ════════════════ TOAST ════════════════ -->
<div class="toast" id="toast"></div>

<script>
// ── PALETTE ──
const COLORS = ['#f5c842','#e8885a','#5ae8a0','#5a9ae8','#e85aa0','#a05ae8','#5ae8d8','#e85a5a','#c8e85a','#e8c85a'];
const EMOJIS = ['🎲','🃏','🏆','🎯','🧩','♟️','🎮','🎰','🪀','🎳','🎸','⚽','🏀','🏈','🎾'];

// ── STATE ──
let state = {
  games: [],       // completed games
  active: null,    // current game object
  currentTab: 'scores',
};

function loadState() {
  try {
    const s = localStorage.getItem('scoretracker_v2');
    if (s) { const d = JSON.parse(s); state.games = d.games || []; state.active = d.active || null; }
  } catch(e) {}
}
function saveState() {
  localStorage.setItem('scoretracker_v2', JSON.stringify({ games: state.games, active: state.active }));
}

// ── TOAST ──
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

// ── NAVIGATION ──
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}
function goHome() {
  closeSheet('overlay-game-menu');
  closeWinner();
  showScreen('screen-home');
  renderHome();
}
function closeIfOverlay(e, id) {
  if (e.target === document.getElementById(id)) closeSheet(id);
}
function closeSheet(id) { document.getElementById(id).classList.remove('open'); }
function openSheet(id) { document.getElementById(id).classList.add('open'); }

// ── HOME ──
function renderHome() {
  const active = state.active;
  const games = state.games;

  let html = '';
  if (active) {
    html += `<div class="section-label">Partita in corso</div>`;
    html += `<div class="game-card" onclick="openActiveGame()">
      <div class="game-card-emoji">${active.emoji}</div>
      <div class="game-card-info">
        <div class="game-card-name">${esc(active.name)}</div>
        <div class="game-card-meta">${active.players.length} giocatori • Round ${active.round}</div>
      </div>
      <div class="game-card-score">
        <div class="score-badge">${Math.max(...active.players.map(p=>p.score))}</div>
        <div class="game-card-date">Toca per riprendere</div>
      </div>
    </div>`;
  }

  const finished = games.slice().reverse();
  if (finished.length) {
    html += `<div class="section-label">Ultime partite</div>`;
    finished.slice(0,10).forEach(g => {
      const winner = [...g.players].sort((a,b)=>b.score-a.score)[0];
      html += `<div class="game-card">
        <div class="game-card-emoji">${g.emoji}</div>
        <div class="game-card-info">
          <div class="game-card-name">${esc(g.name)}</div>
          <div class="game-card-meta">${g.players.length} giocatori</div>
        </div>
        <div class="game-card-score">
          <div class="score-badge" style="color:var(--accent)">${winner?.score ?? 0}</div>
          <div class="game-card-date">${esc(winner?.name ?? '')} 🏆</div>
        </div>
      </div>`;
    });
  }

  const content = document.getElementById('home-content');
  const bannerWrap = document.getElementById('install-banner-wrap');
  document.getElementById('active-games-section').innerHTML = html;
  document.getElementById('empty-home').style.display = (!active && !finished.length) ? 'block' : 'none';
}

function openActiveGame() {
  if (!state.active) return;
  showScreen('screen-game');
  switchTab('scores');
  renderGame();
}
function openHistoryFull() {
  const list = document.getElementById('full-history-list');
  const games = state.games.slice().reverse();
  if (!games.length) { list.innerHTML = '<p style="color:var(--text2);padding:20px 0">Nessuna partita completata.</p>'; }
  else {
    list.innerHTML = games.map(g => {
      const sorted = [...g.players].sort((a,b)=>b.score-a.score);
      return `<div class="stats-card">
        <div class="stats-card-title">${g.emoji} ${esc(g.name)}</div>
        ${sorted.map((p,i)=>`<div class="ranking-row">
          <span class="rank-num ${i===0?'gold':i===1?'silver':i===2?'bronze':''}">#${i+1}</span>
          <span style="flex:1;font-size:14px">${esc(p.name)}</span>
          <span style="font-family:'DM Mono',monospace;font-size:15px">${p.score}</span>
        </div>`).join('')}
      </div>`;
    }).join('');
  }
  openSheet('overlay-history-full');
}

// ── NEW GAME ──
let newPlayerCount = 0;
let selectedEmoji = '🎲';

function openNewGame() {
  newPlayerCount = 0;
  document.getElementById('input-game-name').value = '';
  document.getElementById('input-game-emoji').value = '🎲';
  document.getElementById('input-start-score').value = '0';
  selectedEmoji = '🎲';
  const list = document.getElementById('new-players-list');
  list.innerHTML = '';

  // emoji picker
  const ep = document.getElementById('emoji-picker');
  ep.innerHTML = '';
  EMOJIS.forEach(em => {
    const s = document.createElement('span');
    s.textContent = em; s.style.cssText = 'font-size:22px;cursor:pointer;padding:3px';
    s.onclick = () => { document.getElementById('input-game-emoji').value = em; selectedEmoji = em; };
    ep.appendChild(s);
  });

  addPlayerRow('Giocatore 1');
  addPlayerRow('Giocatore 2');
  openSheet('overlay-new-game');
  setTimeout(() => document.getElementById('input-game-name').focus(), 300);
}

function addPlayerRow(defaultName) {
  newPlayerCount++;
  const color = COLORS[newPlayerCount % COLORS.length];
  const div = document.createElement('div');
  div.className = 'player-row';
  div.dataset.color = color;
  div.innerHTML = `
    <div class="player-color-dot" style="background:${color}" onclick="cycleDotColor(this)"></div>
    <input class="player-name-input" value="${defaultName || 'Giocatore ' + newPlayerCount}" maxlength="20">
    <button class="player-remove" onclick="this.closest('.player-row').remove()">✕</button>`;
  document.getElementById('new-players-list').appendChild(div);
}

function cycleDotColor(dot) {
  const current = COLORS.indexOf(dot.style.background.replace(/\s/g,''));
  const next = COLORS[(current + 1) % COLORS.length];
  dot.style.background = next;
  dot.closest('.player-row').dataset.color = next;
}

function createGame() {
  const name = document.getElementById('input-game-name').value.trim() || 'Partita';
  const emoji = document.getElementById('input-game-emoji').value.trim() || '🎲';
  const startScore = parseInt(document.getElementById('input-start-score').value) || 0;

  const rows = document.querySelectorAll('#new-players-list .player-row');
  if (!rows.length) { toast('Aggiungi almeno un giocatore!'); return; }

  const players = [];
  rows.forEach(r => {
    const n = r.querySelector('.player-name-input').value.trim() || 'Giocatore';
    const c = r.dataset.color || COLORS[0];
    players.push({ id: Math.random().toString(36).slice(2), name: n, color: c, score: startScore });
  });

  state.active = {
    id: Date.now().toString(),
    name, emoji, players,
    round: 1,
    history: [],
    startScore,
    createdAt: new Date().toISOString(),
  };
  saveState();
  closeSheet('overlay-new-game');
  openActiveGame();
}

// ── GAME RENDER ──
function renderGame() {
  if (!state.active) return;
  const g = state.active;
  document.getElementById('game-title').textContent = g.emoji + ' ' + g.name;
  document.getElementById('game-round-label').textContent = `Round ${g.round}`;

  const sorted = [...g.players].sort((a,b)=>b.score-a.score);
  const maxScore = sorted.length ? Math.max(...g.players.map(p=>p.score)) : 0;
  const leaderId = sorted[0]?.id;

  // SCORES TAB
  const grid = document.getElementById('players-grid');
  grid.innerHTML = g.players.map((p,idx) => {
    const rank = sorted.findIndex(s=>s.id===p.id) + 1;
    const isLeader = p.id === leaderId;
    return `<div class="player-tile ${isLeader?'leader':''}" id="tile-${p.id}">
      <span class="rank-badge">#${rank}</span>
      <div class="player-dot" style="background:${p.color}">${p.name.charAt(0).toUpperCase()}</div>
      <div class="player-tile-name">${esc(p.name)}</div>
      <div class="player-tile-score" style="color:${p.color}">${p.score}</div>
      <div class="score-controls">
        <button class="score-btn minus" onclick="quickScore('${p.id}',-1)">−</button>
        <button class="score-btn plus" onclick="quickScore('${p.id}',1)">＋</button>
      </div>
      <div class="custom-add">
        <input class="custom-input" id="ci-${p.id}" type="number" placeholder="±pts">
        <button class="apply-btn" onclick="applyCustom('${p.id}')">OK</button>
      </div>
    </div>`;
  }).join('');

  // HISTORY TAB
  renderHistoryTab();
  // STATS TAB
  renderStatsTab();
}

function renderHistoryTab() {
  const g = state.active;
  if (!g) return;
  const hist = g.history.slice().reverse();
  document.getElementById('history-list').innerHTML = hist.length
    ? hist.map(h => `<div class="history-entry">
        <div class="history-dot" style="background:${h.color}"></div>
        <span class="history-player">${esc(h.name)}</span>
        <span class="history-delta ${h.delta>0?'pos':'neg'}">${h.delta>0?'+':''}${h.delta}</span>
        <span style="font-size:11px;color:var(--text3);margin-left:4px">${h.round ? 'R'+h.round : ''}</span>
      </div>`).join('')
    : '<p style="color:var(--text3);font-size:14px;padding:8px 0">Nessuna mossa ancora.</p>';
}

function renderStatsTab() {
  const g = state.active;
  if (!g) return;
  const sorted = [...g.players].sort((a,b) => b.score-a.score);
  const maxScore = sorted[0]?.score || 1;

  document.getElementById('stats-content').innerHTML = `
    <div class="stats-card">
      <div class="stats-card-title">Classifica</div>
      ${sorted.map((p,i) => `
        <div class="ranking-row">
          <span class="rank-num ${i===0?'gold':i===1?'silver':i===2?'bronze':''}">#${i+1}</span>
          <div class="player-dot" style="background:${p.color};width:24px;height:24px;font-size:11px">${p.name.charAt(0).toUpperCase()}</div>
          <span style="flex:1;font-size:14px;padding-left:6px">${esc(p.name)}</span>
          <div class="ranking-bar-wrap"><div class="ranking-bar" style="background:${p.color};width:${Math.max(5,(p.score/maxScore)*100)}%"></div></div>
          <span class="ranking-score">${p.score}</span>
        </div>`).join('')}
    </div>
    <div class="stats-card">
      <div class="stats-card-title">Info Partita</div>
      <div style="display:flex;gap:24px;flex-wrap:wrap">
        <div><div style="font-size:11px;color:var(--text3)">ROUND</div><div style="font-family:'Bebas Neue';font-size:32px">${g.round}</div></div>
        <div><div style="font-size:11px;color:var(--text3)">MOSSE</div><div style="font-family:'Bebas Neue';font-size:32px">${g.history.length}</div></div>
        <div><div style="font-size:11px;color:var(--text3)">GIOCATORI</div><div style="font-family:'Bebas Neue';font-size:32px">${g.players.length}</div></div>
        <div><div style="font-size:11px;color:var(--text3)">DIFF.</div><div style="font-family:'Bebas Neue';font-size:32px;color:var(--accent2)">${sorted.length>1?sorted[0].score-sorted[sorted.length-1].score:0}</div></div>
      </div>
    </div>`;
}

function switchTab(tab) {
  state.currentTab = tab;
  document.querySelectorAll('.tab').forEach((t,i) => {
    t.classList.toggle('active', ['scores','history','stats'][i] === tab);
  });
  document.getElementById('tab-scores').style.display = tab === 'scores' ? 'block' : 'none';
  document.getElementById('tab-history').style.display = tab === 'history' ? 'block' : 'none';
  document.getElementById('tab-stats').style.display = tab === 'stats' ? 'block' : 'none';
  if (tab === 'history') renderHistoryTab();
  if (tab === 'stats') renderStatsTab();
}

// ── SCORING ──
function quickScore(playerId, delta) {
  const g = state.active;
  const p = g.players.find(x => x.id === playerId);
  if (!p) return;
  p.score += delta;
  g.history.push({ name: p.name, color: p.color, delta, round: g.round });
  saveState();
  renderGame();
  // Haptic
  if (navigator.vibrate) navigator.vibrate(30);
}

function applyCustom(playerId) {
  const val = parseInt(document.getElementById('ci-'+playerId).value);
  if (isNaN(val)) { toast('Inserisci un numero!'); return; }
  const g = state.active;
  const p = g.players.find(x => x.id === playerId);
  if (!p) return;
  p.score += val;
  g.history.push({ name: p.name, color: p.color, delta: val, round: g.round });
  document.getElementById('ci-'+playerId).value = '';
  saveState();
  renderGame();
  if (navigator.vibrate) navigator.vibrate(40);
  toast(`${p.name}: ${val > 0 ? '+' : ''}${val} pt`);
}

// ── GAME MENU ──
function openGameMenu() { openSheet('overlay-game-menu'); }

function addRound() {
  state.active.round++;
  saveState();
  closeSheet('overlay-game-menu');
  renderGame();
  toast(`Round ${state.active.round} iniziato! 🎯`);
}

function shareGame() {
  const g = state.active;
  const sorted = [...g.players].sort((a,b)=>b.score-a.score);
  const text = `🎲 ${g.name} — Round ${g.round}\n` +
    sorted.map((p,i)=>`${i===0?'🥇':i===1?'🥈':i===2?'🥉':'  '} ${p.name}: ${p.score}`).join('\n');
  if (navigator.share) navigator.share({ title: g.name, text });
  else { navigator.clipboard?.writeText(text); toast('Punteggi copiati! 📋'); }
  closeSheet('overlay-game-menu');
}

function showWinner() {
  closeSheet('overlay-game-menu');
  const g = state.active;
  const winner = [...g.players].sort((a,b)=>b.score-a.score)[0];
  if (!winner) return;
  document.getElementById('winner-name').textContent = winner.name;
  document.getElementById('winner-name').style.color = winner.color;
  document.getElementById('winner-score').textContent = `${winner.score} punti`;
  spawnConfetti();
  document.getElementById('winner-overlay').classList.add('open');
}
function closeWinner() { document.getElementById('winner-overlay').classList.remove('open'); }

function spawnConfetti() {
  const c = document.getElementById('confetti');
  c.innerHTML = '';
  for (let i = 0; i < 40; i++) {
    const p = document.createElement('div');
    p.className = 'confetti-piece';
    p.style.cssText = `
      left:${Math.random()*100}%;
      background:${COLORS[Math.floor(Math.random()*COLORS.length)]};
      animation-duration:${1.5+Math.random()*2}s;
      animation-delay:${Math.random()*1.5}s;
      width:${6+Math.random()*6}px;
      height:${6+Math.random()*10}px;
    `;
    c.appendChild(p);
  }
}

function confirmEndGame() {
  if (!confirm('Vuoi terminare ed eliminare questa partita?')) return;
  if (state.active) {
    state.games.push({ ...state.active, endedAt: new Date().toISOString() });
    state.active = null;
    saveState();
  }
  closeSheet('overlay-game-menu');
  goHome();
  toast('Partita terminata!');
}

// ── UTILS ──
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── PWA INSTALL ──
let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  const wrap = document.getElementById('install-banner-wrap');
  wrap.innerHTML = `<div class="install-banner" onclick="installApp()">
    <div class="install-banner-icon">📲</div>
    <div class="install-banner-text">
      <div class="install-banner-title">Installa su Android</div>
      <div class="install-banner-sub">Aggiungi alla home per usarla offline</div>
    </div>
    <button class="install-banner-close" onclick="event.stopPropagation();this.closest('.install-banner').closest('div').remove()">✕</button>
  </div>`;
});

function installApp() {
  if (deferredPrompt) { deferredPrompt.prompt(); deferredPrompt = null; }
}

// ── INIT ──
loadState();
renderHome();
if (state.active) {
  // Show a "resume" hint, but stay on home
}
</script>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    });
  }
</script>
</body>
</html>
